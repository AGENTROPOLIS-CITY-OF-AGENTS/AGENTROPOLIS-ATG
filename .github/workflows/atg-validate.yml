name: ATG Schema + ATRALITH Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install jsonschema
      - name: Validate all schemas are well-formed
        run: PYTHONPATH=. python3 validate_atg.py --check-schemas
      - name: Validate fixtures
        run: |
          PYTHONPATH=. python3 validate_atg.py mandate tests/fixtures/valid-mandate.json
          PYTHONPATH=. python3 validate_atg.py envelope tests/fixtures/valid-envelope.json
          PYTHONPATH=. python3 validate_atg.py receipt tests/fixtures/valid-receipt.json
          PYTHONPATH=. python3 validate_atg.py risk tests/fixtures/valid-risk.json
      - name: Confirm invalid fixtures are rejected
        run: |
          PYTHONPATH=. python3 validate_atg.py mandate tests/fixtures/invalid-mandate.json && exit 1 || true
          PYTHONPATH=. python3 validate_atg.py envelope tests/fixtures/invalid-envelope-blind-without-fallback.json && exit 1 || true
          PYTHONPATH=. python3 validate_atg.py receipt tests/fixtures/invalid-receipt-missing-fields.json && exit 1 || true
      - name: Lint existing JSON schemas
        run: PYTHONPATH=. python3 -c 'import json,glob;[json.load(open(f)) or print("OK",f) for f in glob.glob("contracts/**/*.schema.json",recursive=True)]'

  atralith-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install jsonschema
      - name: Run ATRALITH smoke test
        run: PYTHONPATH=. python3 atralith/smoke_test.py
