name: ATG CI

on:
  pull_request:
    paths:
      - "packages/**"
      - "schemas/atg/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/atg-ci.yml"
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: pip install . pytest jsonschema ruff
      - run: ruff check packages tests
      - run: python -m pytest tests -q
