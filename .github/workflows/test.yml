name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema
      - name: Run repository unittest suite
        run: |
          python -m unittest discover -s atralith -p "test_*.py" -v
          python -m unittest discover -s tests -p "test_*.py" -v
      - name: Headless loop-baseline smoke
        run: node tests/smoke_loop_baseline.mjs
