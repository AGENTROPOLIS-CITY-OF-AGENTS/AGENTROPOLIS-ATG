[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "atralith-lite"
version = "0.1.0"
description = "ATRALITH-lite — reference implementation of ATG mandate, envelope, and receipt primitives for AGENTROPOLIS-ATG"
requires-python = ">=3.10"
dependencies = [
    "jsonschema[format]>=4.18",
]

[project.scripts]
atralith = "atralith.cli:main"
